services:
  # Primary 24/7 Live Stream Broadcaster Service (Optimized YouTube RTMP Engine)
  youtube-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-streamer
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PORT=5000
      - STREAM_WIDTH=1280
      - STREAM_HEIGHT=720
      - STREAM_FPS=30
      - STREAM_BITRATE=2500k
      - ENABLE_WEBGL=false
      - VIDEO_CODEC=libx264
    volumes:
      - ./recordings:/app/recordings
    command: ["node", "dist/browser/live_stream.js"]

  # Optional Background Cloud Video Recorder (5-Min Auto-Chunks to Firebase Storage)
  youtube-recorder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-recorder
    restart: unless-stopped
    shm_size: "2gb"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - ./recordings:/app/recordings
    command: ["node", "dist/browser/init.js"]
    profiles:
      - recorder
